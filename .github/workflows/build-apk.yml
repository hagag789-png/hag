name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: MahafezCash-apk, path: app/build/outputs/apk/release/app-release.apk }
      - name: Publish as downloadable release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp app/build/outputs/apk/release/app-release.apk MahafezCash.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest MahafezCash.apk --title "MahafezCash APK" --notes "ثبّت الملف على هاتف أندرويد"
